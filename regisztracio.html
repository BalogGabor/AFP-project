<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeLoad - Load in seconds.</title>
</head>
<body>
<main>
  
    <h1>Felhasználó / kapcsolattartó regisztráció</h1>
    <h2>Minden mezőt töltsön ki!</h2>

    <div>
        <h3>Válassza ki, hogy milyen szerepkörben szeretne regisztrálni:</h3>
        <h4>Ön szabad járműkapacitással rendelkezik (szállító), vagy pedig áruszállításban van szüksége segítségre? (megbízó)?</h4>
    </div>

    <div>
       
        <form method="post">
            <input type="radio" name="szerepkor_valaszto" id="szkvalaszto1">
            <label for="szkvalaszto1">Szállító</label>
            <input type="radio" name="szerepkor_valaszto" id="szkvalaszto2">
            <label for="szkvalaszto2">Megbízó</label>
            <hr>
            
            <label for="email">E-mail cím:</label>
            <input type="email" name="e-mail" id="email">
            <hr>
            
            <label for="vnev">Vezetéknév:</label>
            <input type="text" name="vezeteknev" id="vnev">
            <hr>
            
            <label for="knev">Keresztnév:</label>
            <input type="text" name="keresztnev" id="knev">
            <hr>
            
            <label for="telszam">Telefonszám:</label>
            <input type="tel" name="telefonszam" id="telszam" placeholder="00-00-000-0000" pattern="[0-9]{2}-[0-9]{2}-[0-9]{3}-[0-9]{4}">
            <hr>
            
            <input type="reset" value="Adatok törlése">
            <hr>
            <!-- JAVÍTVA: A submit gomb szintaxisa javítva lett -->
            <input type="submit" value="Beküldés">
        </form>
    </div>
</main>

<footer>
    <h3 id="kapcsolat">Kapcsolat</h3>
    <a href="mailto:info@veload.hu">Lépjen velünk kapcsolatba</a>
    <p>info@veload.hu</p>
</footer>
</body>
</html>
